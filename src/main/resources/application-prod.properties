# --- Puerto: 81 + 77 = 8177 ---
server.port=8177

# --- Base de datos PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/agrosmart_db
spring.datasource.username=agrosmart
spring.datasource.password=agrosmart
spring.datasource.driver-class-name=org.postgresql.Driver

# --- ORM: JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Módulo de IA (LangChain4j) ---
langchain4j.open-ai.chat-model.api-key=demo
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.timeout=30s
